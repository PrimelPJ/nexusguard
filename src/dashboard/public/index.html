<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusGuard — Real-time Rate Limit Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 24px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      border-bottom: 1px solid #222;
      padding-bottom: 16px;
    }
    header h1 { font-size: 1.4rem; color: #fff; letter-spacing: 1px; }
    .badge {
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .badge-live { background: #1a3a1a; color: #4caf50; border: 1px solid #4caf50; }
    .badge-off  { background: #3a1a1a; color: #f44336; border: 1px solid #f44336; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }
    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 20px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: #444; }
    .card-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #666;
      margin-bottom: 4px;
    }
    .card-algo {
      font-size: 1rem;
      font-weight: 700;
      color: #64b5f6;
      margin-bottom: 16px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #1a1a1a;
      font-size: 0.85rem;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: #888; }
    .stat-value { color: #fff; font-weight: 600; }
    .stat-value.green { color: #4caf50; }
    .stat-value.red   { color: #f44336; }
    .stat-value.yellow{ color: #ffc107; }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #1e1e1e;
      border-radius: 3px;
      margin-top: 12px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease, background 0.5s ease;
    }

    .footer {
      text-align: center;
      margin-top: 32px;
      color: #444;
      font-size: 0.7rem;
    }
    #connection-status { transition: all 0.3s; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ NexusGuard</h1>
    <span id="connection-status" class="badge badge-off">CONNECTING</span>
  </header>

  <div class="grid" id="cards-container">
    <!-- Cards injected by JS -->
  </div>

  <div class="footer">
    Updates every 1s via WebSocket &nbsp;|&nbsp; NexusGuard v1.0.0
  </div>

  <script>
    const ALGO_LABELS = {
      sliding_window: "Sliding Window Counter",
      token_bucket:   "Token Bucket",
      leaky_bucket:   "Leaky Bucket",
      fixed_window:   "Fixed Window Counter",
    };

    let wsConnected = false;

    function connect() {
      const ws = new WebSocket(`ws://${location.host}/metrics/ws`);
      const statusEl = document.getElementById("connection-status");

      ws.onopen = () => {
        wsConnected = true;
        statusEl.textContent = "LIVE";
        statusEl.className = "badge badge-live";
      };

      ws.onclose = () => {
        wsConnected = false;
        statusEl.textContent = "RECONNECTING";
        statusEl.className = "badge badge-off";
        setTimeout(connect, 2000);
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === "metrics") renderCards(msg.data);
      };
    }

    function renderCards(data) {
      const container = document.getElementById("cards-container");
      container.innerHTML = "";

      for (const [algo, metrics] of Object.entries(data)) {
        const blockPct = (metrics.blockRate * 100).toFixed(1);
        const barColor = metrics.blockRate < 0.1 ? "#4caf50"
                       : metrics.blockRate < 0.5 ? "#ffc107"
                       : "#f44336";

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-title">Algorithm</div>
          <div class="card-algo">${ALGO_LABELS[algo] || algo}</div>

          <div class="stat-row">
            <span class="stat-label">Allowed</span>
            <span class="stat-value green">${metrics.allowed.toLocaleString()}</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Blocked</span>
            <span class="stat-value red">${metrics.blocked.toLocaleString()}</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Total Requests</span>
            <span class="stat-value">${metrics.total.toLocaleString()}</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Block Rate</span>
            <span class="stat-value ${metrics.blockRate < 0.1 ? 'green' : metrics.blockRate < 0.5 ? 'yellow' : 'red'}">${blockPct}%</span>
          </div>

          <div class="progress-bar">
            <div class="progress-fill" style="width:${blockPct}%; background:${barColor}"></div>
          </div>
        `;
        container.appendChild(card);
      }
    }

    connect();
  </script>
</body>
</html>
